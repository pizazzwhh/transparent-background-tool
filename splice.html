function detectLang(){
  const url=new URL(location.href);
  const param=url.searchParams.get('lang');
  if(param&&messages[param])return param;
  const saved=localStorage.getItem('language');
  if(saved&&messages[saved])return saved;
  const navLangs=navigator.languages||[navigator.language];
  for(const l of navLangs){
    const lc=l.toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    if(lc.startsWith('ja'))return 'ja';
    if(lc.startsWith('ko'))return 'ko';
    if(lc.startsWith('es'))return 'es';
    if(lc.startsWith('fr'))return 'fr';
    if(lc.startsWith('de'))return 'de';
    if(lc.startsWith('ru'))return 'ru';
    if(lc.startsWith('pt'))return 'pt';
    if(lc.startsWith('ar'))return 'ar';
    if(lc.startsWith('vi'))return 'vi';
    if(lc.startsWith('id'))return 'id';
    if(lc.startsWith('th'))return 'th';
    if(lc.startsWith('en'))return 'en';
  }
  return 'en';
}

let language=detectLang();

const langSelect=$('#langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
langSelect.value=language;

function setLanguage(lang){
  if(!messages[lang])lang='en';
  language=lang;
  localStorage.setItem('language',lang);

  const langDef=LANGS.find(l=>l.code===lang)||LANGS[1];
  document.documentElement.lang=lang;
  document.documentElement.dir=langDef.dir;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(messages[lang][key]!==undefined)el.innerHTML=messages[lang][key];
  });

  const s=SEO[lang]||SEO.en;
  document.title=s.title;
  setMeta('name','description',s.desc);
  setMeta('property','og:title',s.ogTitle);
  setMeta('property','og:description',s.ogDesc);
  setMeta('property','og:locale',s.locale);
  setMeta('property','og:site_name',s.siteName);
  setMeta('name','twitter:title',s.ogTitle);
  setMeta('name','twitter:description',s.ogDesc);
  setMeta('name','application-name',s.siteName);
  setMeta('name','apple-mobile-web-app-title',s.siteName);

  const ld=document.querySelector('#ldjson');
  if(ld){
    const ldObj=JSON.parse(ld.textContent);
    ldObj.name=s.title.split(' - ')[0];
    ldObj.alternateName=s.siteName;
    ldObj.description=s.jsonLdDesc;
    ld.textContent=JSON.stringify(ldObj);
  }

  updateAlignLabels();
  updateMeta();
}

function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}

langSelect.onchange=()=>setLanguage(langSelect.value);

function loadFiles(files) {
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) return;
  list.forEach(f => {
    const img = new Image();
    const url = URL.createObjectURL(f);
    img.onload = () => {
      URL.revokeObjectURL(url);
      images.push({ img, name: f.name.replace(/\.[^.]+$/, ''), w: img.naturalWidth, h: img.naturalHeight });
      renderList();
      renderPreview();
    };
    img.src = url;
  });
}

function renderList() {
  thumbList.innerHTML = '';
  images.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.draggable = true;
    div.ondragstart = e => { dragIndex = i; div.classList.add('dragging'); };
    div.ondragend = () => div.classList.remove('dragging');
    div.ondragover = e => e.preventDefault();
    div.ondrop = e => {
      e.preventDefault();
      div.classList.remove('dragging');
      if (dragIndex !== null && dragIndex !== i) {
        const [moved] = images.splice(dragIndex, 1);
        images.splice(i, 0, moved);
        renderList();
        renderPreview();
      }
      dragIndex = null;
    };
    const src = item.img.src;
    div.innerHTML = `
      <span class="idx">${i + 1}</span>
      <img src="${src}" alt="">
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="dim">${item.w} × ${item.h}</div>
      </div>
      <button class="del" title="×">×</button>
    `;
    div.querySelector('.del').onclick = () => {
      images.splice(i, 1);
      renderList();
      renderPreview();
    };
    thumbList.appendChild(div);
  });
}

function updateAlignLabels() {
  const labels = direction === 'h'
    ? [messages[language].alignH1, messages[language].alignH2, messages[language].alignH3]
    : [messages[language].alignV1, messages[language].alignV2, messages[language].alignV3];
  $('#alignSeg').querySelectorAll('button').forEach((b, i) => b.textContent = labels[i]);
}

function updateMeta() {
  const has = images.length > 0;
  if (!has) {
    $('#meta').innerHTML = messages[language].waiting;
  }
}

function renderPreview() {
  const has = images.length > 0;
  $('#download').disabled = !has;
  $('#clear').disabled = !has;
  if (!has) {
    canvas.style.display = 'none';
    empty.style.display = 'block';
    updateMeta();
    return;
  }
  const gap = +$('#gap').value;
  const bg = $('#bgColor').value;

  let totalW, totalH;
  if (direction === 'h') {
    totalW = images.reduce((s, it) => s + it.w, 0) + gap * (images.length - 1);
    totalH = Math.max(...images.map(it => it.h));
  } else {
    totalW = Math.max(...images.map(it => it.w));
    totalH = images.reduce((s, it) => s + it.h, 0) + gap * (images.length - 1);
  }

  canvas.width = totalW;
  canvas.height = totalH;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, totalW, totalH);

  let offset = 0;
  images.forEach(it => {
    let x, y;
    if (direction === 'h') {
      x = offset;
      if (alignment === 'start') y = 0;
      else if (alignment === 'center') y = (totalH - it.h) / 2;
      else y = totalH - it.h;
    } else {
      y = offset;
      if (alignment === 'start') x = 0;
      else if (alignment === 'center') x = (totalW - it.w) / 2;
      else x = totalW - it.w;
    }
    ctx.drawImage(it.img, x, y);
    offset += (direction === 'h' ? it.w : it.h) + gap;
  });

  canvas.style.display = 'block';
  empty.style.display = 'none';
  const countText = language === 'zh' ? '张图片' : language === 'en' ? 'images' : language === 'ja' ? '枚の画像' : language === 'ko' ? '장의 이미지' : language === 'es' ? 'imágenes' : language === 'fr' ? 'images' : language === 'de' ? 'Bilder' : language === 'ru' ? 'изображений' : language === 'pt' ? 'imagens' : language === 'ar' ? 'صورة' : language === 'vi' ? 'ảnh' : language === 'id' ? 'gambar' : 'รูป';
  $('#meta').textContent = `${images.length} ${countText} · ${totalW} × ${totalH}px`;
}

file.onchange = e => { if (e.target.files.length) loadFiles(e.target.files); file.value = ''; };
['dragenter', 'dragover'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

document.addEventListener('paste', e => {
  const items = [...e.clipboardData.items].filter(x => x.type.startsWith('image/'));
  if (items.length) loadFiles(items.map(x => x.getAsFile()));
});

$('#gap').addEventListener('input', e => { $('#gapV').textContent = e.target.value; renderPreview(); });

$('#bgColor').addEventListener('input', e => { $('#bgColorText').textContent = e.target.value; renderPreview(); });

$('#dirSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  direction = btn.dataset.dir;
  $('#dirSeg').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
  updateAlignLabels();
  renderPreview();
});

$('#alignSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  alignment = btn.dataset.align;
  $('#alignSeg').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
  renderPreview();
});

$('#clear').onclick = () => { images = []; renderList(); renderPreview(); };

$('#download').onclick = () => {
  if (!images.length) return;
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'spliced-image.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
};

setLanguage(language);
</script>
<script>
(function(){
  var p = encodeURIComponent(location.pathname + location.search);
  var u = '/__track__?t=' + Date.now() + '&p=' + p;
  try {
    var img = new Image();
    img.alt = '';
    img.style.position = 'absolute';
    img.style.width = '0';
    img.style.height = '0';
    img.src = u;
    document.body.appendChild(img);
  } catch(e) {}
  try {
    if (navigator.sendBeacon) navigator.sendBeacon(u);
  } catch(e2) {}
})();
</script>
