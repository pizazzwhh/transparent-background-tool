<script>
/* ===== 工具函数 ===== */
const $=s=>document.querySelector(s);
const file=$('#file'),drop=$('#drop'),preview=$('#preview'),empty=$('#empty'),wrap=$('#wrap');

/* ===== 状态变量 ===== */
let sourceImg=null;       // 原始图片对象
let origName='image';     // 原始文件名（不含扩展名）
let origBlob=null;        // 原始文件 Blob（用于大小对比）
let scaleMode='percent';  // 缩放模式：percent / pixel
let compressTimer=null;   // 防抖计时器

/* ===== 格式化文件大小 ===== */
function fmtSize(bytes){
  if(bytes<1024)return bytes+' B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1024/1024).toFixed(2)+' MB';
}

/* ===== 根据原始格式决定输出 MIME ===== */
function getOutputMime(){
  const fmt=$('#format').value;
  if(fmt!=='auto')return fmt==='webp'?'image/webp':fmt==='png'?'image/png':'image/jpeg';
  // 保持原格式：根据原始 blob 类型
  if(origBlob){
    if(origBlob.type==='image/png')return 'image/png';
    if(origBlob.type==='image/webp')return 'image/webp';
    if(origBlob.type==='image/jpeg')return 'image/jpeg';
  }
  return 'image/jpeg'; // 兜底
}

/* ===== 计算缩放后的目标宽度 ===== */
function getTargetWidth(){
  if(!sourceImg)return 0;
  const ow=sourceImg.naturalWidth;
  if(scaleMode==='percent'){
    const p=Math.max(1,Math.min(100,+$('#scalePercent').value||100));
    return Math.max(1,Math.round(ow*p/100));
  }else{
    return Math.max(1,+$('#scalePixel').value||ow);
  }
}

/* ===== 加载图片 ===== */
function load(blob,filename){
  if(!blob||!blob.type.startsWith('image/'))return;
  origBlob=blob;
  origName=(filename||'image').replace(/\.[^.]+$/,'');
  const img=new Image();
  const url=URL.createObjectURL(blob);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    sourceImg=img;
    empty.style.display='none';
    preview.style.display='block';
    $('#download').disabled=$('#reset').disabled=false;
    // 同步像素宽度默认值为原图宽度
    $('#scalePixel').value=img.naturalWidth;
    $('#meta').textContent=`${img.naturalWidth} × ${img.naturalHeight}px · ${fmtSize(blob.size)}`;
    schedule();
  };
  img.src=url;
}

/* ===== 执行压缩并预览 ===== */
function compress(){
  if(!sourceImg)return;
  const mime=getOutputMime();
  const quality=+$('#quality').value/100;
  const tw=getTargetWidth();
  const ow=sourceImg.naturalWidth,oh=sourceImg.naturalHeight;
  // 按宽度等比缩放
  const th=Math.round(oh*tw/ow);
  // 创建画布并绘制
  const cv=document.createElement('canvas');
  cv.width=tw;cv.height=th;
  const cx=cv.getContext('2d');
  // JPG 不支持透明，用白色填充背景
  if(mime==='image/jpeg'){cx.fillStyle='#ffffff';cx.fillRect(0,0,tw,th);}
  cx.drawImage(sourceImg,0,0,tw,th);
  // 输出 Blob
  cv.toBlob(blob=>{
    if(!blob)return;
    // 预览
    const oldUrl=preview.src;
    if(oldUrl&&oldUrl.startsWith('blob:'))URL.revokeObjectURL(oldUrl);
    preview.src=URL.createObjectURL(blob);
    // 大小对比
    $('#origSize').textContent=fmtSize(origBlob.size);
    $('#compSize').textContent=fmtSize(blob.size);
    const diff=origBlob.size-blob.size;
    const pct=origBlob.size>0?Math.round(diff/origBlob.size*100):0;
    const r=$('#ratio');
    r.style.display='block';
    if(diff>0){
      r.innerHTML=`压缩率 <span class="pos">${pct}%</span> · 节省 ${fmtSize(diff)}`;
    }else if(diff<0){
      r.innerHTML=`<span style="color:#c44">体积反而增加 ${fmtSize(-diff)}，建议调低质量或转 WebP</span>`;
    }else{
      r.innerHTML=`体积无变化`;
    }
    $('#stats').style.display='grid';
    $('#meta').textContent=`${tw} × ${th}px · ${fmtSize(blob.size)}`;
    // 暂存用于下载
    compress._blob=blob;
    compress._ext=mime==='image/png'?'png':mime==='image/webp'?'webp':'jpg';
  },mime,mime==='image/png'?undefined:quality);
}

/* ===== 防抖 ===== */
function schedule(){
  clearTimeout(compressTimer);
  compressTimer=setTimeout(compress,120);
}

/* ===== 事件绑定 ===== */
file.onchange=e=>{if(e.target.files[0])load(e.target.files[0],e.target.files[0].name);};
['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])load(e.dataTransfer.files[0],e.dataTransfer.files[0].name);});
// 粘贴支持
document.addEventListener('paste',e=>{
  const item=[...e.clipboardData.items].find(x=>x.type.startsWith('image/'));
  if(item)load(item.getAsFile(),'pasted-image.png');
});

// 质量滑块实时预览
$('#quality').addEventListener('input',e=>{$('#qualityV').textContent=e.target.value;schedule();});
// 格式变化
$('#format').addEventListener('change',schedule);
// 缩放输入
$('#scalePercent').addEventListener('input',schedule);
$('#scalePixel').addEventListener('input',schedule);
// 缩放模式切换
document.querySelectorAll('#scaleMode button').forEach(btn=>{
  btn.onclick=()=>{
    scaleMode=btn.dataset.mode;
    document.querySelectorAll('#scaleMode button').forEach(b=>b.classList.toggle('active',b===btn));
    $('#scalePercent').style.display=scaleMode==='percent'?'block':'none';
    $('#scalePixel').style.display=scaleMode==='pixel'?'block':'none';
    schedule();
  };
});

// 下载
$('#download').onclick=()=>{
  if(!compress._blob)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(compress._blob);
  a.download=`${origName}-compressed.${compress._ext}`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

// 恢复默认
$('#reset').onclick=()=>{
  $('#format').value='auto';
  $('#quality').value=75;$('#qualityV').textContent=75;
  $('#scalePercent').value=100;
  if(sourceImg)$('#scalePixel').value=sourceImg.naturalWidth;
  scaleMode='percent';
  document.querySelectorAll('#scaleMode button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='percent'));
  $('#scalePercent').style.display='block';
  $('#scalePixel').style.display='none';
  schedule();
};
</script>
</body>
</html>
