<style>
:root{
  --ink:#18201d;--muted:#69736f;--paper:#f5f3ec;--card:#fffef9;--line:#d9ddd8;
  --accent:#087f5b;--accent2:#c7f1df;--shadow:0 24px 70px #163d2b14;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:radial-gradient(circle at 10% 0,#dff6e9 0,transparent 32rem),var(--paper);
  min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 32px;max-width:1200px;margin:0 auto;flex-wrap:wrap;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:20px}
.mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;font-size:16px;font-weight:800;
}
.toolnav{display:flex;gap:6px;flex-wrap:wrap}
.toolnav a{
  text-decoration:none;color:var(--muted);font-size:13px;padding:7px 12px;border-radius:8px;
  transition:.15s;background:transparent;
}
.toolnav a:hover{background:var(--accent2);color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:8px 24px 48px}
.hero{text-align:center;padding:36px 0 28px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-0.5px;margin-bottom:10px}
.hero p{color:var(--muted);font-size:16px;max-width:620px;margin:0 auto}
.badge{
  display:inline-flex;align-items:center;gap:6px;background:var(--accent2);color:var(--accent);
  padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-top:16px;
}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.toolCard{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:28px;margin-top:16px;
}
.dropzone{
  border:2px dashed var(--line);border-radius:14px;padding:46px 24px;text-align:center;
  cursor:pointer;transition:.2s;background:var(--paper);
}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent2)}
.dropzone .icon{font-size:40px;margin-bottom:8px}
.dropzone p{color:var(--muted);font-size:14px}
.dropzone strong{color:var(--accent)}
.workarea{display:none;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
@media(max-width:760px){.workarea{grid-template-columns:1fr}}
.panel{background:var(--paper);border-radius:12px;padding:18px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
/* 棋盘格预览背景 */
.previewBox{
  border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:200px;
  display:flex;align-items:center;justify-content:center;
  background-image:
    linear-gradient(45deg,#dfe3df 25%,transparent 25%),
    linear-gradient(-45deg,#dfe3df 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#dfe3df 75%),
    linear-gradient(-45deg,transparent 75%,#dfe3df 75%);
  background-size:16px 16px;
  background-position:0 0,0 8px,8px -8px,-8px 0;
  background-color:#fff;
}
.previewBox canvas{max-width:100%;height:auto;display:block}
.controls{display:flex;flex-direction:column;gap:18px}
.controlGroup label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.presetColors{display:flex;flex-wrap:wrap;gap:10px}
.presetColors button{
  width:46px;height:46px;border-radius:10px;border:2px solid var(--line);cursor:pointer;
  transition:.15s;position:relative;
}
.presetColors button.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.presetColors button::after{
  content:attr(data-name);position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--muted);white-space:nowrap;
}
.colorRow{display:flex;align-items:center;gap:12px;margin-top:30px}
.colorRow input[type=color]{
  width:54px;height:38px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:none;
}
.colorRow code{font-size:13px;color:var(--muted)}
.tabRow{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tabRow button{
  flex:1;padding:8px;border:none;border-radius:7px;background:transparent;font-size:13px;
  font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;
}
.tabRow button.active{background:var(--ink);color:#fff}
.gradientConfig{display:none;flex-direction:column;gap:14px}
.gradientColors{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gradientColors > div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.gradientColors input[type=color]{
  width:54px;height:38px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:none;
}
.dirBtns{display:flex;gap:6px;flex-wrap:wrap}
.dirBtns button{
  padding:8px 14px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;
  font-size:13px;cursor:pointer;color:var(--muted);font-weight:600;transition:.15s;
}
.dirBtns button.active{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
.btnRow{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.btn{
  padding:11px 22px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;

.primary{background:var(--ink);color:#fff}
.primary:hover{background:var(--accent)}
.secondary{background:#e9ece8;color:var(--ink)}
.secondary:hover{background:var(--line)}
.formatBtns{display:flex;gap:8px}
.formatBtns button{
  flex:1;padding:11px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;

}
.formatBtns button.active{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
.relatedTools{margin-top:40px;text-align:center}
.relatedTools h2{font-size:20px;margin-bottom:18px}
.toolGrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.toolGrid a{
  text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
  padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;transition:.15s;
}
.toolGrid a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
footer{text-align:center;padding:24px;color:var(--muted);font-size:12px}

<main>
  <section class="hero">
    <h1>透明PNG加背景色</h1>
    <p>上传透明PNG图片，为其添加纯色或渐变背景，棋盘格预览透明区域，一键导出JPG或PNG。</p>

<footer>透白工具 · 所有处理均在浏览器本地完成，图片不会离开您的设备</footer>

<script>
(function(){
  // ============ DOM 元素 ============
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const workarea = document.getElementById('workarea');
  const preview = document.getElementById('preview');
  const ctx = preview.getContext('2d');
  const bgTypeTabs = document.getElementById('bgTypeTabs');
  const solidConfig = document.getElementById('solidConfig');
  const gradientConfig = document.getElementById('gradientConfig');
  const presetColors = document.getElementById('presetColors');
  const customColor = document.getElementById('customColor');
  const colorCode = document.getElementById('colorCode');
  const gradColor1 = document.getElementById('gradColor1');
  const gradColor2 = document.getElementById('gradColor2');
  const dirBtns = document.getElementById('dirBtns');
  const formatBtns = document.getElementById('formatBtns');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');

  // ============ 状态变量 ============
  let sourceImage = null;     // 透明PNG图片
  let bgType = 'solid';       // 背景类型：solid / gradient
  let solidColor = '#FFFFFF'; // 纯色背景色
  let gradDir = 'horizontal'; // 渐变方向
  let outFormat = 'png';      // 输出格式

  // ============ 加载图片文件 ============
  function loadFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => { sourceImage = img; showWorkarea(); render(); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ============ 显示工作区 ============
  function showWorkarea(){
    dropzone.style.display = 'none';
    workarea.style.display = 'grid';
  }

  // ============ 创建渐变对象 ============
  function createGradient(w, h){
    let g;
    if(gradDir === 'horizontal'){
      // 水平：从左到右
      g = ctx.createLinearGradient(0, 0, w, 0);
    } else if(gradDir === 'vertical'){
      // 垂直：从上到下
      g = ctx.createLinearGradient(0, 0, 0, h);
    } else {
      // 对角：从左上到右下
      g = ctx.createLinearGradient(0, 0, w, h);
    }
    g.addColorStop(0, gradColor1.value);
    g.addColorStop(1, gradColor2.value);
    return g;
  }

  // ============ 渲染：先填充背景再叠加透明PNG ============
  function render(){
    if(!sourceImage) return;

    // 限制最大尺寸
    const maxW = 1200;
    let w = sourceImage.width, h = sourceImage.height;
    if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
    preview.width = w; preview.height = h;

    // 第一步：填充背景
    if(bgType === 'solid'){
      ctx.fillStyle = solidColor;
      ctx.fillRect(0, 0, w, h);
    } else {
      ctx.fillStyle = createGradient(w, h);
      ctx.fillRect(0, 0, w, h);
    }

    // 第二步：叠加透明PNG（保留透明区域的背景色）
    ctx.drawImage(sourceImage, 0, 0, w, h);
  }

  // ============ 事件：上传 ============
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('drag');
    if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
  document.addEventListener('paste', e => {
    const items = e.clipboardData.items;
    for(const item of items){
      if(item.type.startsWith('image/')){ loadFile(item.getAsFile()); break; }
    }
  });

  // ============ 事件：背景类型切换 ============
  bgTypeTabs.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    bgTypeTabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    bgType = btn.dataset.type;
    solidConfig.style.display = bgType === 'solid' ? 'block' : 'none';
    gradientConfig.style.display = bgType === 'gradient' ? 'flex' : 'none';
    render();
  });

  // ============ 事件：预设纯色 ============
  presetColors.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    presetColors.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    solidColor = btn.dataset.color;
    customColor.value = solidColor;
    colorCode.textContent = solidColor.toUpperCase();
    render();
  });

  // ============ 事件：自定义纯色 ============
  customColor.addEventListener('input', e => {
    solidColor = e.target.value;
    colorCode.textContent = solidColor.toUpperCase();
    presetColors.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    render();
  });

  // ============ 事件：渐变颜色 ============
  gradColor1.addEventListener('input', render);
  gradColor2.addEventListener('input', render);

  // ============ 事件：渐变方向 ============
  dirBtns.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    dirBtns.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gradDir = btn.dataset.dir;
    render();
  });

  // ============ 事件：输出格式 ============
  formatBtns.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    formatBtns.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    outFormat = btn.dataset.fmt;
  });

  // ============ 事件：下载 ============
  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    if(outFormat === 'jpg'){
      // JPG 不支持透明，需要额外创建一个白色底的canvas
      const tmpCanvas = document.createElement('canvas');
      tmpCanvas.width = preview.width;
      tmpCanvas.height = preview.height;
      const tmpCtx = tmpCanvas.getContext('2d');
      tmpCtx.fillStyle = '#FFFFFF';
      tmpCtx.fillRect(0, 0, tmpCanvas.width, tmpCanvas.height);
      tmpCtx.drawImage(preview, 0, 0);
      link.download = '加背景_' + Date.now() + '.jpg';
      link.href = tmpCanvas.toDataURL('image/jpeg', 0.92);
    } else {
      link.download = '加背景_' + Date.now() + '.png';
      link.href = preview.toDataURL('image/png');
    }
    link.click();
  });

  // ============ 事件：重新上传 ============
  resetBtn.addEventListener('click', () => {
    sourceImage = null;
    workarea.style.display = 'none';
    dropzone.style.display = 'block';
    fileInput.value = '';
  });
})();
</script>
