<script>
(function(){
  // ============ DOM 元素 ============
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const workarea = document.getElementById('workarea');
  const preview = document.getElementById('preview');
  const ctx = preview.getContext('2d', { willReadFrequently: true });
  const sampleInfo = document.getElementById('sampleInfo');
  const presetColors = document.getElementById('presetColors');
  const customColor = document.getElementById('customColor');
  const colorCode = document.getElementById('colorCode');
  const tolerance = document.getElementById('tolerance');
  const tolVal = document.getElementById('tolVal');
  const feather = document.getElementById('feather');
  const featherVal = document.getElementById('featherVal');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');

  // ============ 状态变量 ============
  let sourceImage = null;       // 原始图片对象
  let originalBg = null;        // 采样得到的原底色 {r,g,b}
  let currentColor = '#FFFFFF'; // 当前选中的新底色

  // ============ 工具函数：hex 转 rgb ============
  function hexToRgb(hex){
    const m = hex.replace('#','');
    return {
      r: parseInt(m.substring(0,2),16),
      g: parseInt(m.substring(2,4),16),
      b: parseInt(m.substring(4,6),16)
    };
  }

  // ============ 工具函数：rgb 转 hex ============
  function rgbToHex(r,g,b){
    const h = v => v.toString(16).padStart(2,'0');
    return '#' + h(r) + h(g) + h(b);
  }

  // ============ 加载图片文件 ============
  function loadFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        sourceImage = img;
        // 采样原底色（四个角的平均色）
        originalBg = sampleBackgroundColor(img);
        showWorkarea();
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ============ 采样原底色：取图片四角各一小块区域的平均色 ============
  function sampleBackgroundColor(img){
    // 用小尺寸canvas采样，提高性能
    const sw = Math.min(100, img.width);
    const sh = Math.min(100, img.height);
    const sc = document.createElement('canvas');
    sc.width = sw; sc.height = sh;
    const sctx = sc.getContext('2d');
    sctx.drawImage(img, 0, 0, sw, sh);
    const data = sctx.getImageData(0,0,sw,sh).data;

    // 采样四角各 8x8 区域
    const corner = 8;
    let r=0,g=0,b=0,count=0;
    const corners = [
      [0,0],[sw-corner,0],[0,sh-corner],[sw-corner,sh-corner]
    ];
    for(const [cx,cy] of corners){
      for(let y=cy;y<cy+corner;y++){
        for(let x=cx;x<cx+corner;x++){
          const idx = (y*sw+x)*4;
          r += data[idx]; g += data[idx+1]; b += data[idx+2]; count++;
        }
      }
    }
    r = Math.round(r/count); g = Math.round(g/count); b = Math.round(b/count);
    return { r, g, b };
  }

  // ============ 显示工作区 ============
  function showWorkarea(){
    dropzone.style.display = 'none';
    workarea.style.display = 'grid';
  }

  // ============ 渲染：执行换底处理 ============
  function render(){
    if(!sourceImage || !originalBg) return;

    // 限制最大尺寸，保证性能
    const maxW = 1000;
    let w = sourceImage.width, h = sourceImage.height;
    if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
    preview.width = w; preview.height = h;
    ctx.drawImage(sourceImage, 0, 0, w, h);

    const imageData = ctx.getImageData(0, 0, w, h);
    const data = imageData.data;

    const newRgb = hexToRgb(currentColor);
    const tol = parseInt(tolerance.value);
    const fea = parseInt(feather.value);
    const oR = originalBg.r, oG = originalBg.g, oB = originalBg.b;
    const nR = newRgb.r, nG = newRgb.g, nB = newRgb.b;

    // 遍历每个像素，根据与原底色的距离决定替换或混合
    for(let i = 0; i < data.length; i += 4){
      const r = data[i], g = data[i+1], b = data[i+2];
      // 颜色欧氏距离
      const dist = Math.sqrt((r-oR)*(r-oR) + (g-oG)*(g-oG) + (b-oB)*(b-oB));

      if(dist <= tol){
        // 完全在容差范围内：直接替换为新底色
        data[i] = nR; data[i+1] = nG; data[i+2] = nB;
      } else if(dist <= tol + fea && fea > 0){
        // 边缘柔化区：按比例混合新底色与原像素
        const ratio = (dist - tol) / fea; // 0=全新色, 1=全原色
        data[i]   = Math.round(nR * (1-ratio) + r * ratio);
        data[i+1] = Math.round(nG * (1-ratio) + g * ratio);
        data[i+2] = Math.round(nB * (1-ratio) + b * ratio);
      }
    }
    ctx.putImageData(imageData, 0, 0);

    // 显示采样信息
    sampleInfo.innerHTML = '🔍 自动检测原底色：<b style="display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin:0 4px;background:' +
      rgbToHex(oR,oG,oB) + ';border:1px solid #ccc"></b><b>' + rgbToHex(oR,oG,oB).toUpperCase() +
      '</b> &nbsp;|&nbsp; 新底色：<b style="display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin:0 4px;background:' +
      currentColor + ';border:1px solid #ccc"></b><b>' + currentColor.toUpperCase() + '</b>';
  }

  // ============ 事件：点击上传 ============
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });

  // ============ 事件：拖拽上传 ============
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('drag');
    if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  // ============ 事件：粘贴上传 ============
  document.addEventListener('paste', e => {
    const items = e.clipboardData.items;
    for(const item of items){
      if(item.type.startsWith('image/')){
        loadFile(item.getAsFile());
        break;
      }
    }
  });

  // ============ 事件：预设底色选择 ============
  presetColors.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    presetColors.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentColor = btn.dataset.color;
    customColor.value = currentColor;
    colorCode.textContent = currentColor.toUpperCase();
    render();
  });

  // ============ 事件：自定义颜色 ============
  customColor.addEventListener('input', e => {
    currentColor = e.target.value;
    colorCode.textContent = currentColor.toUpperCase();
    presetColors.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    render();
  });

  // ============ 事件：容差滑块 ============
  tolerance.addEventListener('input', () => { tolVal.textContent = tolerance.value; render(); });

  // ============ 事件：边缘柔化滑块 ============
  feather.addEventListener('input', () => { featherVal.textContent = feather.value; render(); });

  // ============ 事件：下载 ============
  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = '证件照_' + currentColor.replace('#','') + '.png';
    link.href = preview.toDataURL('image/png');
    link.click();
  });

  // ============ 事件：重新上传 ============
  resetBtn.addEventListener('click', () => {
    sourceImage = null; originalBg = null;
    workarea.style.display = 'none';
    dropzone.style.display = 'block';
    fileInput.value = '';
  });
})();
</script>
