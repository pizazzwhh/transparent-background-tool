function detectLang(){
  const url=new URL(location.href);
  const param=url.searchParams.get('lang');
  if(param&&messages[param])return param;
  const saved=localStorage.getItem('language');
  if(saved&&messages[saved])return saved;
  const navLangs=navigator.languages||[navigator.language];
  for(const l of navLangs){
    const lc=l.toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    if(lc.startsWith('ja'))return 'ja';
    if(lc.startsWith('ko'))return 'ko';
    if(lc.startsWith('es'))return 'es';
    if(lc.startsWith('fr'))return 'fr';
    if(lc.startsWith('de'))return 'de';
    if(lc.startsWith('ru'))return 'ru';
    if(lc.startsWith('pt'))return 'pt';
    if(lc.startsWith('ar'))return 'ar';
    if(lc.startsWith('vi'))return 'vi';
    if(lc.startsWith('id'))return 'id';
    if(lc.startsWith('th'))return 'th';
    if(lc.startsWith('en'))return 'en';
  }
  return 'en';
}

let language=detectLang();

const langSelect=document.getElementById('langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
langSelect.value=language;

function msg(key,lang){
  lang=lang||language;
  if(messages[lang]&&messages[lang][key]!==undefined)return messages[lang][key];
  if(messages.en&&messages.en[key]!==undefined)return messages.en[key];
  return key;
}

function setLanguage(lang){
  if(!messages[lang])lang='en';
  language=lang;
  localStorage.setItem('language',lang);

  const langDef=LANGS.find(l=>l.code===lang)||LANGS[1];
  document.documentElement.lang=lang;
  document.documentElement.dir=langDef.dir;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(messages[lang][key]!==undefined)el.innerHTML=messages[lang][key];
  });

  const s=SEO[lang]||SEO.en;
  document.title=s.title;
  setMeta('name','description',s.desc);
  setMeta('property','og:title',s.ogTitle);
  setMeta('property','og:description',s.ogDesc);
  setMeta('property','og:locale',s.locale);
  setMeta('property','og:site_name',s.siteName);
  setMeta('name','twitter:title',s.ogTitle);
  setMeta('name','twitter:description',s.ogDesc);
  setMeta('name','application-name',s.siteName);
  setMeta('name','apple-mobile-web-app-title',s.siteName);

  const ld=document.querySelector('#ldjson');
  if(ld){
    const ldObj=JSON.parse(ld.textContent);
    ldObj.name=s.title.split(' - ')[0];
    ldObj.alternateName=s.siteName;
    ldObj.description=s.jsonLdDesc;
    ld.textContent=JSON.stringify(ldObj);
  }

  if(typeof doRender==='function')doRender();
}

function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}

langSelect.onchange=()=>setLanguage(langSelect.value);
setLanguage(language);
</script>

<script>
(function(){
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const workarea = document.getElementById('workarea');
  const preview = document.getElementById('preview');
  const ctx = preview.getContext('2d');
  const typeTabs = document.getElementById('typeTabs');
  const textConfig = document.getElementById('textConfig');
  const imageConfig = document.getElementById('imageConfig');
  const wmText = document.getElementById('wmText');
  const fontSize = document.getElementById('fontSize');
  const sizeVal = document.getElementById('sizeVal');
  const textColor = document.getElementById('textColor');
  const opacity = document.getElementById('opacity');
  const opacityVal = document.getElementById('opacityVal');
  const wmUpload = document.getElementById('wmUpload');
  const wmFile = document.getElementById('wmFile');
  const wmPreview = document.getElementById('wmPreview');
  const wmSize = document.getElementById('wmSize');
  const wmSizeVal = document.getElementById('wmSizeVal');
  const wmOpacity = document.getElementById('wmOpacity');
  const wmOpacityVal = document.getElementById('wmOpacityVal');
  const tileMode = document.getElementById('tileMode');
  const rotateGroup = document.getElementById('rotateGroup');
  const rotate = document.getElementById('rotate');
  const rotateVal = document.getElementById('rotateVal');
  const positionGroup = document.getElementById('positionGroup');
  const grid9 = document.getElementById('grid9');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');

  let sourceImage = null;
  let wmType = 'text';
  let wmImage = null;
  let position = 'tl';

  window.doRender = function(){ if(sourceImage) render(); };

  function loadFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => { sourceImage = img; showWorkarea(); render(); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function loadWmFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => { wmImage = img; wmPreview.src = e.target.result; wmPreview.style.display = 'block'; render(); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function showWorkarea(){
    dropzone.style.display = 'none';
    workarea.style.display = 'grid';
  }

  function getPosition(w, h, wmW, wmH, pos, padding){
    padding = padding || 20;
    let x, y;
    const v = pos[1];
    if(v === 'l') x = padding;
    else if(v === 'c') x = (w - wmW) / 2;
    else x = w - wmW - padding;
    if(pos[0] === 't') y = padding;
    else if(pos[0] === 'm') y = (h - wmH) / 2;
    else y = h - wmH - padding;
    return { x, y };
  }

  function render(){
    if(!sourceImage) return;

    const maxW = 1200;
    let w = sourceImage.width, h = sourceImage.height;
    if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
    preview.width = w; preview.height = h;

    ctx.drawImage(sourceImage, 0, 0, w, h);

    if(wmType === 'text'){
      drawTextWatermark(w, h);
    } else {
      drawImageWatermark(w, h);
    }
  }

  function drawTextWatermark(w, h){
    const text = wmText.value || 'Watermark';
    const size = parseInt(fontSize.value);
    const color = textColor.value;
    const op = parseFloat(opacity.value);
    const isTile = tileMode.checked;
    const angle = parseInt(rotate.value);

    ctx.save();
    ctx.globalAlpha = op;
    ctx.fillStyle = color;
    ctx.font = 'bold ' + size + 'px Inter, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'middle';

    if(isTile){
      const textW = ctx.measureText(text).width;
      const stepX = textW + size * 2;
      const stepY = size * 2.5;
      ctx.translate(w / 2, h / 2);
      ctx.rotate(angle * Math.PI / 180);
      const diag = Math.sqrt(w * w + h * h);
      const cols = Math.ceil(diag / stepX) + 2;
      const rows = Math.ceil(diag / stepY) + 2;
      for(let row = -rows; row <= rows; row++){
        for(let col = -cols; col <= cols; col++){
          ctx.fillText(text, col * stepX, row * stepY);
        }
      }
    } else {
      const textW = ctx.measureText(text).width;
      const padding = 20;
      const pos = getPosition(w, h, textW, size, position, padding);
      ctx.fillText(text, pos.x, pos.y + size / 2);
    }
    ctx.restore();
  }

  function drawImageWatermark(w, h){
    if(!wmImage) return;
    const targetSize = parseInt(wmSize.value);
    const op = parseFloat(wmOpacity.value);
    const isTile = tileMode.checked;
    const angle = parseInt(rotate.value);

    const scale = targetSize / Math.max(wmImage.width, wmImage.height);
    const wmW = Math.max(1, Math.round(wmImage.width * scale));
    const wmH = Math.max(1, Math.round(wmImage.height * scale));

    ctx.save();
    ctx.globalAlpha = op;

    if(isTile){
      const stepX = wmW + wmW * 0.5;
      const stepY = wmH + wmH * 0.5;
      ctx.translate(w / 2, h / 2);
      ctx.rotate(angle * Math.PI / 180);
      const diag = Math.sqrt(w * w + h * h);
      const cols = Math.ceil(diag / stepX) + 2;
      const rows = Math.ceil(diag / stepY) + 2;
      for(let row = -rows; row <= rows; row++){
        for(let col = -cols; col <= cols; col++){
          ctx.drawImage(wmImage, col * stepX - wmW / 2, row * stepY - wmH / 2, wmW, wmH);
        }
      }
    } else {
      const padding = 20;
      const pos = getPosition(w, h, wmW, wmH, position, padding);
      ctx.drawImage(wmImage, pos.x, pos.y, wmW, wmH);
    }
    ctx.restore();
  }

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('drag');
    if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
  document.addEventListener('paste', e => {
    const items = e.clipboardData.items;
    for(const item of items){
      if(item.type.startsWith('image/')){ loadFile(item.getAsFile()); break; }
    }
  });

  wmUpload.addEventListener('click', () => wmFile.click());
  wmFile.addEventListener('change', e => { if(e.target.files[0]) loadWmFile(e.target.files[0]); });

  typeTabs.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    typeTabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    wmType = btn.dataset.type;
    textConfig.style.display = wmType === 'text' ? 'block' : 'none';
    imageConfig.style.display = wmType === 'image' ? 'block' : 'none';
    render();
  });

  wmText.addEventListener('input', render);
  fontSize.addEventListener('input', () => { sizeVal.textContent = fontSize.value; render(); });
  textColor.addEventListener('input', render);
  opacity.addEventListener('input', () => { opacityVal.textContent = opacity.value; render(); });

  wmSize.addEventListener('input', () => { wmSizeVal.textContent = wmSize.value; render(); });
  wmOpacity.addEventListener('input', () => { wmOpacityVal.textContent = wmOpacity.value; render(); });

  tileMode.addEventListener('change', () => {
    if(tileMode.checked){
      rotateGroup.style.display = 'block';
      positionGroup.style.display = 'none';
    } else {
      rotateGroup.style.display = 'none';
      positionGroup.style.display = 'block';
    }
    render();
  });
  rotate.addEventListener('input', () => { rotateVal.textContent = rotate.value; render(); });

  grid9.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    grid9.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    position = btn.dataset.pos;
    render();
  });

  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'watermarked_' + Date.now() + '.png';
    link.href = preview.toDataURL('image/png');
    link.click();
  });

  resetBtn.addEventListener('click', () => {
    sourceImage = null; wmImage = null;
    workarea.style.display = 'none';
    dropzone.style.display = 'block';
    fileInput.value = ''; wmFile.value = '';
    wmPreview.style.display = 'none';
  });
})();
</script>
<script>
(function(){
  var p = encodeURIComponent(location.pathname + location.search);
  var u = '/__track__?t=' + Date.now() + '&p=' + p;
  try {
    var img = new Image();
    img.alt = '';
    img.style.position = 'absolute';
    img.style.width = '0';
    img.style.height = '0';
    img.src = u;
    document.body.appendChild(img);
  } catch(e) {}
  try {
    if (navigator.sendBeacon) navigator.sendBeacon(u);
  } catch(e2) {}
})();
</script>
