<script>
const $ = s => document.querySelector(s);
const file = $('#file'), drop = $('#drop'), canvas = $('#canvas'), ctx = canvas.getContext('2d');
const empty = $('#empty');

let source = null;       // 原始图片
let name = 'image';      // 文件名（无扩展名）
let currentPreset = 'original';

// 滤镜参数集合
const filters = { brightness: 0, contrast: 0, saturate: 0, sepia: 0, grayscale: 0, invert: 0, hueRotate: 0, blur: 0 };

// 预设滤镜配置：组合多个 CSS filter 值
const presets = {
  original:    { brightness: 0,  contrast: 0,   saturate: 0,   sepia: 0,   grayscale: 0,   invert: 0,   hueRotate: 0,   blur: 0 },
  grayscale:   { brightness: 0,  contrast: 0,   saturate: 0,   sepia: 0,   grayscale: 100, invert: 0,   hueRotate: 0,   blur: 0 },
  invert:      { brightness: 0,  contrast: 0,   saturate: 0,   sepia: 0,   grayscale: 0,   invert: 100, hueRotate: 0,   blur: 0 },
  sepia:       { brightness: 0,  contrast: 0,   saturate: 0,   sepia: 100, grayscale: 0,   invert: 0,   hueRotate: 0,   blur: 0 },
  warm:        { brightness: 5,  contrast: 5,   saturate: 20,  sepia: 30,  grayscale: 0,   invert: 0,   hueRotate: -15, blur: 0 },
  cold:        { brightness: 0,  contrast: 5,   saturate: 10,  sepia: 0,   grayscale: 0,   invert: 0,   hueRotate: 180, blur: 0 },
  highcontrast:{ brightness: 0,  contrast: 50,  saturate: 20,  sepia: 0,   grayscale: 0,   invert: 0,   hueRotate: 0,   blur: 0 },
  softfocus:   { brightness: 10, contrast: -15, saturate: -10, sepia: 10,  grayscale: 0,   invert: 0,   hueRotate: 0,   blur: 1 }
};

/* ===== 加载图片 ===== */
function load(blob, filename = 'image.png') {
  if (!blob || !blob.type.startsWith('image/')) return;
  const img = new Image();
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    URL.revokeObjectURL(url);
    source = img;
    name = filename.replace(/\.[^.]+$/, '');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    empty.style.display = 'none';
    canvas.style.display = 'block';
    $('#download').disabled = $('#reset').disabled = false;
    $('#meta').textContent = `${img.naturalWidth} × ${img.naturalHeight}px`;
    render();
  };
  img.src = url;
}

/* ===== 构建 CSS filter 字符串 ===== */
function buildFilter() {
  // brightness/contrast/saturate 以 100% 为基准，偏移值直接叠加百分比
  const b = 100 + filters.brightness;
  const c = 100 + filters.contrast;
  const s = 100 + filters.saturate;
  return `brightness(${b}%) contrast(${c}%) saturate(${s}%) sepia(${filters.sepia}%) grayscale(${filters.grayscale}%) invert(${filters.invert}%) hue-rotate(${filters.hueRotate}deg) blur(${filters.blur}px)`;
}

/* ===== 渲染预览 ===== */
function render() {
  if (!source) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.filter = buildFilter();
  ctx.drawImage(source, 0, 0);
  ctx.filter = 'none';
}

/* ===== 应用预设滤镜 ===== */
function applyPreset(preset) {
  const p = presets[preset];
  if (!p) return;
  currentPreset = preset;
  Object.keys(p).forEach(k => filters[k] = p[k]);
  // 同步滑块显示
  $('#brightness').value = filters.brightness;
  $('#contrast').value = filters.contrast;
  $('#saturate').value = filters.saturate;
  $('#brightnessV').textContent = filters.brightness;
  $('#contrastV').textContent = filters.contrast;
  $('#saturateV').textContent = filters.saturate;
  render();
}

/* ===== 文件输入与拖放 ===== */
file.onchange = e => { if (e.target.files[0]) load(e.target.files[0], e.target.files[0].name); };
['dragenter', 'dragover'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0], e.dataTransfer.files[0].name); });

/* 粘贴图片 */
document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(x => x.type.startsWith('image/'));
  if (item) load(item.getAsFile(), 'pasted-image.png');
});

/* 滑块调整：手动调整后取消预设选中状态 */
['brightness', 'contrast', 'saturate'].forEach(id => {
  $('#' + id).addEventListener('input', e => {
    filters[id] = +e.target.value;
    $('#' + id + 'V').textContent = e.target.value;
    // 手动调整意味着不再是纯预设
    document.querySelectorAll('#presetGrid button').forEach(b => b.classList.remove('active'));
    render();
  });
});

/* 预设按钮 */
$('#presetGrid').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#presetGrid button').forEach(b => b.classList.toggle('active', b === btn));
  applyPreset(btn.dataset.preset);
});

/* 重置 */
$('#reset').onclick = () => {
  applyPreset('original');
  document.querySelectorAll('#presetGrid button').forEach(b => b.classList.toggle('active', b.dataset.preset === 'original'));
};

/* 下载 */
$('#download').onclick = () => {
  if (!source) return;
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + '-filtered.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
};
</script>
