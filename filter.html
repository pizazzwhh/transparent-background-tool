function detectLang(){
  const url=new URL(location.href);
  const param=url.searchParams.get('lang');
  if(param&&messages[param])return param;
  const saved=localStorage.getItem('language');
  if(saved&&messages[saved])return saved;
  const navLangs=navigator.languages||[navigator.language];
  for(const l of navLangs){
    const lc=l.toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    if(lc.startsWith('ja'))return 'ja';
    if(lc.startsWith('ko'))return 'ko';
    if(lc.startsWith('es'))return 'es';
    if(lc.startsWith('fr'))return 'fr';
    if(lc.startsWith('de'))return 'de';
    if(lc.startsWith('ru'))return 'ru';
    if(lc.startsWith('pt'))return 'pt';
    if(lc.startsWith('ar'))return 'ar';
    if(lc.startsWith('vi'))return 'vi';
    if(lc.startsWith('id'))return 'id';
    if(lc.startsWith('th'))return 'th';
    if(lc.startsWith('en'))return 'en';
  }
  return 'en';
}

let language=detectLang();

const langSelect=$('#langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
langSelect.value=language;

function setLanguage(lang){
  if(!messages[lang])lang='en';
  language=lang;
  localStorage.setItem('language',lang);

  const langDef=LANGS.find(l=>l.code===lang)||LANGS[1];
  document.documentElement.lang=lang;
  document.documentElement.dir=langDef.dir;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(messages[lang][key]!==undefined)el.innerHTML=messages[lang][key];
  });

  const s=SEO[lang]||SEO.en;
  document.title=s.title;
  setMeta('name','description',s.desc);
  setMeta('property','og:title',s.ogTitle);
  setMeta('property','og:description',s.ogDesc);
  setMeta('property','og:locale',s.locale);
  setMeta('property','og:site_name',s.siteName);
  setMeta('name','twitter:title',s.ogTitle);
  setMeta('name','twitter:description',s.ogDesc);
  setMeta('name','application-name',s.siteName);
  setMeta('name','apple-mobile-web-app-title',s.siteName);

  const ld=document.querySelector('#ldjson');
  if(ld){
    const ldObj=JSON.parse(ld.textContent);
    ldObj.name=s.title.split(' - ')[0];
    ldObj.alternateName=s.siteName;
    ldObj.description=s.jsonLdDesc;
    ld.textContent=JSON.stringify(ldObj);
  }

  updateMeta();
}

function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}

langSelect.onchange=()=>setLanguage(langSelect.value);

function updateMeta() {
  if (source) {
    $('#meta').textContent = `${source.naturalWidth} × ${source.naturalHeight}px`;
  }
}

function load(blob, filename = 'image.png') {
  if (!blob || !blob.type.startsWith('image/')) return;
  const img = new Image();
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    URL.revokeObjectURL(url);
    source = img;
    name = filename.replace(/\.[^.]+$/, '');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    empty.style.display = 'none';
    canvas.style.display = 'block';
    $('#download').disabled = $('#reset').disabled = false;
    updateMeta();
    render();
  };
  img.src = url;
}

function buildFilter() {
  const b = 100 + filters.brightness;
  const c = 100 + filters.contrast;
  const s = 100 + filters.saturate;
  return `brightness(${b}%) contrast(${c}%) saturate(${s}%) sepia(${filters.sepia}%) grayscale(${filters.grayscale}%) invert(${filters.invert}%) hue-rotate(${filters.hueRotate}deg) blur(${filters.blur}px)`;
}

function render() {
  if (!source) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.filter = buildFilter();
  ctx.drawImage(source, 0, 0);
  ctx.filter = 'none';
}

function applyPreset(preset) {
  const p = presets[preset];
  if (!p) return;
  currentPreset = preset;
  Object.keys(p).forEach(k => filters[k] = p[k]);
  $('#brightness').value = filters.brightness;
  $('#contrast').value = filters.contrast;
  $('#saturate').value = filters.saturate;
  $('#brightnessV').textContent = filters.brightness;
  $('#contrastV').textContent = filters.contrast;
  $('#saturateV').textContent = filters.saturate;
  render();
}

file.onchange = e => { if (e.target.files[0]) load(e.target.files[0], e.target.files[0].name); };
['dragenter', 'dragover'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0], e.dataTransfer.files[0].name); });

document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(x => x.type.startsWith('image/'));
  if (item) load(item.getAsFile(), 'pasted-image.png');
});

['brightness', 'contrast', 'saturate'].forEach(id => {
  $('#' + id).addEventListener('input', e => {
    filters[id] = +e.target.value;
    $('#' + id + 'V').textContent = e.target.value;
    document.querySelectorAll('#presetGrid button').forEach(b => b.classList.remove('active'));
    render();
  });
});

$('#presetGrid').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#presetGrid button').forEach(b => b.classList.toggle('active', b === btn));
  applyPreset(btn.dataset.preset);
});

$('#reset').onclick = () => {
  applyPreset('original');
  document.querySelectorAll('#presetGrid button').forEach(b => b.classList.toggle('active', b.dataset.preset === 'original'));
};

$('#download').onclick = () => {
  if (!source) return;
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + '-filtered.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
};

setLanguage(language);
</script>
<script>
(function(){
  var p = encodeURIComponent(location.pathname + location.search);
  var u = '/__track__?t=' + Date.now() + '&p=' + p;
  try {
    var img = new Image();
    img.alt = '';
    img.style.position = 'absolute';
    img.style.width = '0';
    img.style.height = '0';
    img.src = u;
    document.body.appendChild(img);
  } catch(e) {}
  try {
    if (navigator.sendBeacon) navigator.sendBeacon(u);
  } catch(e2) {}
})();
</script>
