function detectLang(){
  const url=new URL(location.href);
  const param=url.searchParams.get('lang');
  if(param&&messages[param])return param;
  const saved=localStorage.getItem('language');
  if(saved&&messages[saved])return saved;
  const navLangs=navigator.languages||[navigator.language];
  for(const l of navLangs){
    const lc=l.toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    if(lc.startsWith('ja'))return 'ja';
    if(lc.startsWith('ko'))return 'ko';
    if(lc.startsWith('es'))return 'es';
    if(lc.startsWith('fr'))return 'fr';
    if(lc.startsWith('de'))return 'de';
    if(lc.startsWith('ru'))return 'ru';
    if(lc.startsWith('pt'))return 'pt';
    if(lc.startsWith('ar'))return 'ar';
    if(lc.startsWith('vi'))return 'vi';
    if(lc.startsWith('id'))return 'id';
    if(lc.startsWith('th'))return 'th';
    if(lc.startsWith('en'))return 'en';
  }
  return 'en';
}

let language=detectLang();

const langSelect=$('#langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
langSelect.value=language;

function setLanguage(lang){
  if(!messages[lang])lang='en';
  language=lang;
  localStorage.setItem('language',lang);

  const langDef=LANGS.find(l=>l.code===lang)||LANGS[1];
  document.documentElement.lang=lang;
  document.documentElement.dir=langDef.dir;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(messages[lang][key]!==undefined)el.innerHTML=messages[lang][key];
  });

  const s=SEO[lang]||SEO.en;
  document.title=s.title;
  setMeta('name','description',s.desc);
  setMeta('property','og:title',s.ogTitle);
  setMeta('property','og:description',s.ogDesc);
  setMeta('property','og:locale',s.locale);
  setMeta('property','og:site_name',s.siteName);
  setMeta('name','twitter:title',s.ogTitle);
  setMeta('name','twitter:description',s.ogDesc);
  setMeta('name','application-name',s.siteName);
  setMeta('name','apple-mobile-web-app-title',s.siteName);

  const ld=document.querySelector('#ldjson');
  if(ld){
    const ldObj=JSON.parse(ld.textContent);
    ldObj.name=s.title.split(' - ')[0];
    ldObj.alternateName=s.siteName;
    ldObj.description=s.jsonLdDesc;
    ld.textContent=JSON.stringify(ldObj);
  }

  updateMarginV();
  updateMeta();
}

function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}

langSelect.onchange=()=>setLanguage(langSelect.value);

function updateMarginV() {
  const val = +$('#margin').value;
  const unit = language === 'zh' ? 'mm' : language === 'ja' ? 'mm' : language === 'ko' ? 'mm' : 'mm';
  $('#marginV').textContent = val + unit;
}

function updateMeta() {
  const has = images.length > 0;
  if (!has) {
    $('#meta').innerHTML = messages[language].waiting;
  } else {
    const countText = language === 'zh' ? '张图片' : language === 'en' ? 'images' : language === 'ja' ? '枚の画像' : language === 'ko' ? '장의 이미지' : language === 'es' ? 'imágenes' : language === 'fr' ? 'images' : language === 'de' ? 'Bilder' : language === 'ru' ? 'изображений' : language === 'pt' ? 'imagens' : language === 'ar' ? 'صورة' : language === 'vi' ? 'ảnh' : language === 'id' ? 'gambar' : 'รูป';
    $('#meta').textContent = `${images.length} ${countText}`;
  }
}

function loadFiles(files) {
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) return;
  list.forEach(f => {
    const img = new Image();
    const url = URL.createObjectURL(f);
    img.onload = () => {
      URL.revokeObjectURL(url);
      images.push({ img, name: f.name.replace(/\.[^.]+$/, ''), w: img.naturalWidth, h: img.naturalHeight });
      renderList();
    };
    img.src = url;
  });
}

function renderList() {
  thumbList.innerHTML = '';
  const has = images.length > 0;
  $('#generate').disabled = !has;
  $('#clear').disabled = !has;
  empty.style.display = has ? 'none' : 'block';
  updateMeta();

  images.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.draggable = true;
    div.ondragstart = e => { dragIndex = i; div.classList.add('dragging'); };
    div.ondragend = () => div.classList.remove('dragging');
    div.ondragover = e => e.preventDefault();
    div.ondrop = e => {
      e.preventDefault();
      div.classList.remove('dragging');
      if (dragIndex !== null && dragIndex !== i) {
        const [moved] = images.splice(dragIndex, 1);
        images.splice(i, 0, moved);
        renderList();
      }
      dragIndex = null;
    };
    const pageText = messages[language].pageText;
    div.innerHTML = `
      <span class="idx">${i + 1}</span>
      <img src="${item.img.src}" alt="">
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="dim">${item.w} × ${item.h}px · ${i + 1} ${pageText}</div>
      </div>
      <button class="del" title="×">×</button>
    `;
    div.querySelector('.del').onclick = () => {
      images.splice(i, 1);
      renderList();
    };
    thumbList.appendChild(div);
  });
}

function computePage(item) {
  const pageSize = $('#pageSize').value;
  const margin = +$('#margin').value;
  const mPt = margin * 2.83465;
  const imgWPt = item.w * 0.75;
  const imgHPt = item.h * 0.75;

  if (pageSize === 'original') {
    return { pw: imgWPt, ph: imgHPt, ix: 0, iy: 0, iw: imgWPt, ih: imgHPt };
  }

  const dims = pageSize === 'a4' ? [595.28, 841.89] : [612, 792];
  const pw = dims[0], ph = dims[1];
  const availW = pw - 2 * mPt;
  const availH = ph - 2 * mPt;
  const scale = Math.min(availW / imgWPt, availH / imgHPt, 1);
  const iw = imgWPt * scale;
  const ih = imgHPt * scale;
  let ix, iy;
  if (position === 'center') {
    ix = (pw - iw) / 2;
    iy = (ph - ih) / 2;
  } else {
    ix = mPt;
    iy = mPt;
  }
  return { pw, ph, ix, iy, iw, ih };
}

function imageToDataURL(item) {
  const c = document.createElement('canvas');
  c.width = item.w;
  c.height = item.h;
  const cx = c.getContext('2d');
  cx.fillStyle = '#ffffff';
  cx.fillRect(0, 0, c.width, c.height);
  cx.drawImage(item.img, 0, 0);
  return c.toDataURL('image/jpeg', 0.92);
}

function generatePDF() {
  if (!images.length) return;
  const btn = $('#generate');
  btn.disabled = true;
  btn.textContent = messages[language].generateLoading;

  setTimeout(() => {
    try {
      const first = computePage(images[0]);
      const pdf = new jsPDF({ unit: 'pt', format: [first.pw, first.ph], orientation: first.pw > first.ph ? 'l' : 'p' });
      pdf.addImage(imageToDataURL(images[0]), 'JPEG', first.ix, first.iy, first.iw, first.ih);

      for (let i = 1; i < images.length; i++) {
        const p = computePage(images[i]);
        pdf.addPage([p.pw, p.ph], p.pw > p.ph ? 'l' : 'p');
        pdf.addImage(imageToDataURL(images[i]), 'JPEG', p.ix, p.iy, p.iw, p.ih);
      }

      pdf.save('images.pdf');
    } catch (err) {
      alert(messages[language].errorMsg + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = messages[language].generate;
    }
  }, 50);
}

file.onchange = e => { if (e.target.files.length) loadFiles(e.target.files); file.value = ''; };
['dragenter', 'dragover'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

document.addEventListener('paste', e => {
  const items = [...e.clipboardData.items].filter(x => x.type.startsWith('image/'));
  if (items.length) loadFiles(items.map(x => x.getAsFile()));
});

$('#margin').addEventListener('input', e => { updateMarginV(); });

$('#posSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  position = btn.dataset.pos;
  $('#posSeg').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
});

$('#clear').onclick = () => { images = []; renderList(); };

$('#generate').onclick = generatePDF;

(function(){
  var p = encodeURIComponent(location.pathname + location.search);
  var u = '/__track__?t=' + Date.now() + '&p=' + p;
  try {
    var img = new Image();
    img.alt = '';
    img.style.position = 'absolute';
    img.style.width = '0';
    img.style.height = '0';
    img.src = u;
    document.body.appendChild(img);
  } catch(e) {}
  try {
    if (navigator.sendBeacon) navigator.sendBeacon(u);

})();
