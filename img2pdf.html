<script>
const $ = s => document.querySelector(s);
const file = $('#file'), drop = $('#drop'), thumbList = $('#thumbList'), empty = $('#empty');

let images = [];        // 图片列表 {img, name, w, h}
let position = 'center';// 图片位置
let dragIndex = null;   // 拖拽排序索引

const { jsPDF } = window.jspdf;

/* ===== 加载文件 ===== */
function loadFiles(files) {
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) return;
  list.forEach(f => {
    const img = new Image();
    const url = URL.createObjectURL(f);
    img.onload = () => {
      URL.revokeObjectURL(url);
      images.push({ img, name: f.name.replace(/\.[^.]+$/, ''), w: img.naturalWidth, h: img.naturalHeight });
      renderList();
    };
    img.src = url;
  });
}

/* ===== 渲染缩略图列表 ===== */
function renderList() {
  thumbList.innerHTML = '';
  const has = images.length > 0;
  $('#generate').disabled = !has;
  $('#clear').disabled = !has;
  empty.style.display = has ? 'none' : 'block';
  $('#meta').textContent = has ? `${images.length} 张图片` : '等待图片';

  images.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.draggable = true;
    div.ondragstart = e => { dragIndex = i; div.classList.add('dragging'); };
    div.ondragend = () => div.classList.remove('dragging');
    div.ondragover = e => e.preventDefault();
    div.ondrop = e => {
      e.preventDefault();
      div.classList.remove('dragging');
      if (dragIndex !== null && dragIndex !== i) {
        const [moved] = images.splice(dragIndex, 1);
        images.splice(i, 0, moved);
        renderList();
      }
      dragIndex = null;
    };
    div.innerHTML = `
      <span class="idx">${i + 1}</span>
      <img src="${item.img.src}" alt="">
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="dim">${item.w} × ${item.h}px · 第 ${i + 1} 页</div>
      </div>
      <button class="del" title="删除">×</button>
    `;
    div.querySelector('.del').onclick = () => {
      images.splice(i, 1);
      renderList();
    };
    thumbList.appendChild(div);
  });
}

/* ===== 计算单页参数 {pw, ph, ix, iy, iw, ih}（单位 pt） ===== */
function computePage(item) {
  const pageSize = $('#pageSize').value;
  const margin = +$('#margin').value;
  const mPt = margin * 2.83465; // mm 转 pt
  // 1px = 0.75pt（96dpi）
  const imgWPt = item.w * 0.75;
  const imgHPt = item.h * 0.75;

  if (pageSize === 'original') {
    // 原始尺寸：页面等于图片尺寸
    return { pw: imgWPt, ph: imgHPt, ix: 0, iy: 0, iw: imgWPt, ih: imgHPt };
  }

  // A4 = 595.28 × 841.89 pt，Letter = 612 × 792 pt
  const dims = pageSize === 'a4' ? [595.28, 841.89] : [612, 792];
  const pw = dims[0], ph = dims[1];
  const availW = pw - 2 * mPt;
  const availH = ph - 2 * mPt;
  // 等比缩放以适应可用区域
  const scale = Math.min(availW / imgWPt, availH / imgHPt, 1);
  const iw = imgWPt * scale;
  const ih = imgHPt * scale;
  let ix, iy;
  if (position === 'center') {
    ix = (pw - iw) / 2;
    iy = (ph - ih) / 2;
  } else {
    ix = mPt;
    iy = mPt;
  }
  return { pw, ph, ix, iy, iw, ih };
}

/* ===== 将图片转为 JPEG dataURL（白底合成，兼容 PDF） ===== */
function imageToDataURL(item) {
  const c = document.createElement('canvas');
  c.width = item.w;
  c.height = item.h;
  const cx = c.getContext('2d');
  // 填充白色背景以处理透明 PNG
  cx.fillStyle = '#ffffff';
  cx.fillRect(0, 0, c.width, c.height);
  cx.drawImage(item.img, 0, 0);
  return c.toDataURL('image/jpeg', 0.92);
}

/* ===== 生成 PDF ===== */
function generatePDF() {
  if (!images.length) return;
  const btn = $('#generate');
  btn.disabled = true;
  btn.textContent = '正在生成...';

  // 用 setTimeout 让 UI 先更新
  setTimeout(() => {
    try {
      // 第一页参数决定 PDF 初始尺寸
      const first = computePage(images[0]);
      const pdf = new jsPDF({ unit: 'pt', format: [first.pw, first.ph], orientation: first.pw > first.ph ? 'l' : 'p' });
      pdf.addImage(imageToDataURL(images[0]), 'JPEG', first.ix, first.iy, first.iw, first.ih);

      // 后续页面
      for (let i = 1; i < images.length; i++) {
        const p = computePage(images[i]);
        pdf.addPage([p.pw, p.ph], p.pw > p.ph ? 'l' : 'p');
        pdf.addImage(imageToDataURL(images[i]), 'JPEG', p.ix, p.iy, p.iw, p.ih);
      }

      pdf.save('images.pdf');
    } catch (err) {
      alert('生成 PDF 失败：' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '生成并下载 PDF';
    }
  }, 50);
}

/* ===== 文件输入与拖放 ===== */
file.onchange = e => { if (e.target.files.length) loadFiles(e.target.files); file.value = ''; };
['dragenter', 'dragover'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

/* 粘贴图片 */
document.addEventListener('paste', e => {
  const items = [...e.clipboardData.items].filter(x => x.type.startsWith('image/'));
  if (items.length) loadFiles(items.map(x => x.getAsFile()));
});

/* 边距滑块 */
$('#margin').addEventListener('input', e => { $('#marginV').textContent = e.target.value + 'mm'; });

/* 图片位置切换 */
$('#posSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  position = btn.dataset.pos;
  $('#posSeg').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
});

/* 清空 */
$('#clear').onclick = () => { images = []; renderList(); };

/* 生成 PDF */
$('#generate').onclick = generatePDF;
</script>
