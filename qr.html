};
const QR_FALLBACKS=['https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js'];
let language=detectLang();
let ecc='M';
let size=512;
let renderSeq=0;
let qrPromise=null;
const langSelect=$('#langSelect');
LANGS.forEach(l=>{
  const opt=document.createElement('option');
  opt.value=l.code;
  opt.textContent=l.name;
  langSelect.appendChild(opt);
});
function detectLang(){
  const param=new URL(location.href).searchParams.get('lang');
  if(param&&messages[param])return param;
  let saved='';
  try{saved=localStorage.getItem('language')||'';}catch(e){}
  if(saved&&messages[saved])return saved;
  const navLangs=navigator.languages||[navigator.language||'zh'];
  for(const l of navLangs){
    const lc=String(l).toLowerCase();
    if(lc.startsWith('zh'))return 'zh';
    const code=lc.slice(0,2);
    if(messages[code])return code;
  }
  return 'zh';
}
function t(key){
  const pack=messages[language]||messages.zh;
  if(pack[key]!=null)return pack[key];
  if(messages.en[key]!=null)return messages.en[key];
  return key;
}
function setMeta(attr,name,content){
  let el=document.querySelector(`meta[${attr}="${name}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
  el.setAttribute('content',content);
}
function readQR(){
  const lib=window.QRCode;
  if(lib&&typeof lib.toCanvas==='function')return lib;
  return null;
}
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    let settled=false;
    const timer=setTimeout(()=>finish(new Error('timeout')),8000);
    function finish(err){
      if(settled)return;
      settled=true;
      clearTimeout(timer);
      s.onload=s.onerror=null;
      if(err){s.remove();reject(err);}
      else resolve();
    }
    s.src=src;
    s.async=true;
    s.onload=()=>finish();
    s.onerror=()=>finish(new Error('load failed'));
    document.head.appendChild(s);
  });
}
function ensureQR(){
  const found=readQR();
  if(found)return Promise.resolve(found);
  if(!qrPromise){
    qrPromise=(async()=>{
      for(const src of QR_FALLBACKS){
        try{
          await loadScript(src);
          const lib=readQR();
          if(lib)return lib;
        }catch(e){}
      }
      return null;
    })();
  }
  return qrPromise.then(lib=>{
    if(!lib)qrPromise=null;
    return lib;
  });
}
function applyI18n(){
  const def=LANGS.find(l=>l.code===language)||LANGS[0];
  document.documentElement.lang=language==='zh'?'zh-CN':language;
  document.documentElement.dir=def.dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const value=t(key);
    if(value!==key)el.innerHTML=value;
  });
  document.querySelectorAll('[data-placeholder]').forEach(el=>{
    el.setAttribute('placeholder',t(el.getAttribute('data-placeholder')));
  });
  const hintKey=ecc==='L'?'eccL':ecc==='Q'?'eccQ':ecc==='H'?'eccH':'eccM';
  $('#eccHint').textContent=t(hintKey);
  const seo=SEO[language]||SEO.en;
  document.title=seo.title;
  setMeta('name','description',seo.desc);
  setMeta('property','og:title',seo.title);
  setMeta('property','og:description',seo.desc);
  setMeta('name','twitter:title',seo.title);
  setMeta('name','twitter:description',seo.desc);
  const ld=document.querySelector('#ldjson');
  if(ld){
    try{
      const obj=JSON.parse(ld.textContent);
      obj.name=t('title');
      obj.description=seo.desc;
      ld.textContent=JSON.stringify(obj);
    }catch(e){}
  }
  if($('#libStatus')&&!$('#libStatus').hidden)$('#libStatus').textContent=t('errLib');
}
function setLanguage(lang){
  if(!messages[lang])lang='en';
  language=lang;
  try{localStorage.setItem('language',lang);}catch(e){}
  langSelect.value=language;
  applyI18n();
  render();
}
function marginValue(){
  const n=parseInt($('#margin').value,10);
  if(!Number.isFinite(n))return 4;
  return Math.min(10,Math.max(0,n));
}
function showEmpty(){
  $('#empty').style.display='';
  $('#wrap').style.display='';
  $('#qrCanvas').style.display='none';
  $('#qrError').hidden=true;
  $('#download').disabled=true;
  $('#clear').disabled=true;
  $('#meta').textContent=t('waiting');
}
function showError(msg){
  $('#empty').style.display='none';
  $('#wrap').style.display='none';
  $('#qrCanvas').style.display='none';
  $('#qrError').hidden=false;
  $('#qrError').textContent=msg;
  $('#meta').textContent=msg;
  $('#download').disabled=true;
  $('#clear').disabled=!$('#text').value;
}
function showReady(){
  const canvas=$('#qrCanvas');
  $('#empty').style.display='none';
  $('#wrap').style.display='';
  $('#qrError').hidden=true;
  canvas.style.display='block';
  $('#download').disabled=false;
  $('#clear').disabled=false;
  $('#meta').textContent=t('ready').replaceAll('{size}',String(canvas.width)).replace('{ecc}',ecc);
  const banner=$('#libStatus');
  if(banner)banner.hidden=true;
}
function render(){
  const text=$('#text').value;
  const seq=++renderSeq;
  if(!text.trim()){showEmpty();return;}
  $('#download').disabled=true;
  $('#clear').disabled=false;
  ensureQR().then(lib=>{
    if(seq!==renderSeq)return;
    if(!lib){showError(t('errLib'));const banner=$('#libStatus');banner.hidden=false;banner.textContent=t('errLib');return;}
    const options={
      errorCorrectionLevel:ecc,
      margin:marginValue(),
      width:size,
      color:{dark:$('#fg').value,light:$('#bg').value}
    };
    try{
      lib.toCanvas($('#qrCanvas'),text,options,function(err){
        if(seq!==renderSeq)return;
        if(err)showError(t('errLong'));
        else showReady();
      });
    }catch(e){
      if(seq!==renderSeq)return;
      showError(t('errLong'));
    }
  });
}
function schedule(){
  clearTimeout(schedule.timer);
  schedule.timer=setTimeout(render,60);
}
$('#text').addEventListener('input',schedule);
$('#margin').addEventListener('input',()=>{
  $('#marginV').textContent=String(marginValue());
  render();
});
$('#fg').addEventListener('input',()=>{$('#fgHex').textContent=$('#fg').value.toUpperCase();render();});
$('#bg').addEventListener('input',()=>{$('#bgHex').textContent=$('#bg').value.toUpperCase();render();});
$('#eccSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-ecc]');
  if(!btn)return;
  ecc=btn.getAttribute('data-ecc');
  $('#eccSeg').querySelectorAll('button').forEach(el=>el.classList.toggle('active',el===btn));
  applyI18n();
  render();
});
$('#sizeSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-size]');
  if(!btn)return;
  size=parseInt(btn.getAttribute('data-size'),10)||512;
  $('#sizeSeg').querySelectorAll('button').forEach(el=>el.classList.toggle('active',el===btn));
  render();
});
$('#clear').addEventListener('click',()=>{
  $('#text').value='';
  render();
  $('#text').focus();
});
$('#download').addEventListener('click',()=>{
  const canvas=$('#qrCanvas');
  if($('#download').disabled||!canvas.width)return;
  canvas.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='imagec-qr.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },'image/png');
});
langSelect.addEventListener('change',()=>setLanguage(langSelect.value));
setLanguage(language);
</script>
<script>
(function(){
  var p = encodeURIComponent(location.pathname + location.search);
  var u = '/__track__?t=' + Date.now() + '&p=' + p;
  try {
    var img = new Image();
    img.alt = '';
    img.style.position = 'absolute';
    img.style.width = '0';
    img.style.height = '0';
    img.src = u;
    document.body.appendChild(img);
  } catch(e) {}
  try {
    if (navigator.sendBeacon) navigator.sendBeacon(u);
  } catch(e2) {}
})();
</script>
